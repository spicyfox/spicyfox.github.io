<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="spixyfox의 프로페셔널 개인 웹사이트">
    <title>spixyfox | S/W 개발자</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#home">spixyfox</a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation">
        메뉴
      </button>
      <nav id="primary-navigation" class="primary-navigation" aria-label="주요 메뉴">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#games">Games</a>
      </nav>
    </header>

    <main>
      <section id="home" class="hero" aria-labelledby="hero-title">
        <p class="eyebrow">S/W 개발자</p>
        <h1 id="hero-title">안녕하세요?</h1>
        <p>안녕하세요. 저는 spicyfox 입니다. 현재 S/W 개발자로 일하고 있습니다. AI 시대에도 잘 적응해서 살아 봅시다.</p>
      </section>

      <section id="about" class="content-card" aria-labelledby="about-title">
        <h2 id="about-title">About</h2>
        <p>회사 열심히 다니고 있습니다.</p>
      </section>

      <section id="games" class="content-card games-card" aria-labelledby="games-title">
        <h2 id="games-title">Games</h2>
        <p><strong>애플스네이크</strong>를 준비하고 있습니다.</p>
        <p class="game-status">게임은 다음 루프에서 추가됩니다.</p>
      </section>
    </main>

    <footer class="site-footer">
      <small>© spixyfox</small>
    </footer>
  </body>
</html>
